<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="auraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="url(#auraGrad)" stroke-width="4" opacity="0.3" filter="url(#glow)"/>
  <!-- Main flowing ring -->
  <path d="M100 25 A75 75 0 1 1 25 100" fill="none" stroke="url(#auraGrad)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Inner accent arc -->
  <path d="M100 45 A55 55 0 0 1 155 100" fill="none" stroke="url(#auraGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Center dot -->
  <circle cx="100" cy="100" r="8" fill="url(#auraGrad)" filter="url(#glow)"/>
  <!-- Small orbital -->
  <circle cx="100" cy="25" r="4" fill="#00ffcc" filter="url(#glow)"/>
</svg>
